<h2>Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>

<h2>Location</h2>
<button id="shareLocation">Share My Location</button>

<script>
// 1️⃣ Login function
document.getElementById("loginBtn").addEventListener("click", async function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const resp = await fetch("http://127.0.0.1:8000/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
            username: email,
            password: password
        })
    });

    if (!resp.ok) {
        alert("Login failed");
        return;
    }

    const data = await resp.json();
    localStorage.setItem("access_token", data.access_token);
    alert("Login success! You can now share your location.");
});

// 2️⃣ Share location function
document.getElementById("shareLocation").addEventListener("click", async function() {
    const token = localStorage.getItem("access_token");
    if (!token) {
        alert("You must login first");
        return;
    }

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(async function(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        const response = await fetch("http://127.0.0.1:8000/location/update", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ latitude: lat, longitude: lng })
        });

        if (response.ok) {
            const data = await response.json();
            console.log(data);
            alert("Location shared successfully!");
        } else {
            const err = await response.text();
            console.error(err);
            alert("Failed to share location");
        }

    }, function(error) {
        alert("Location access denied!");
    });
});
</script>
