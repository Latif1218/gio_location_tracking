<h2>Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>

<h2>Location</h2>
<button id="shareLocation">Start Location Tracking</button>

<script>
const UPDATE_INTERVAL = 5000; // 5 seconds
let trackingStarted = false;
let intervalId = null;

// 🔹 Login
document.getElementById("loginBtn").addEventListener("click", async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const resp = await fetch("http://127.0.0.1:8000/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
            username: email,
            password: password
        })
    });

    if (!resp.ok) {
        alert("Login failed");
        return;
    }

    const data = await resp.json();
    localStorage.setItem("access_token", data.access_token);
    alert("Login success! Now start location tracking.");
});

// 🔹 Share / Start tracking
document.getElementById("shareLocation").addEventListener("click", function () {

    if (trackingStarted) {
        alert("Location tracking already running");
        return;
    }

    trackingStarted = true;
    shareLocation(); // first call immediately

    intervalId = setInterval(shareLocation, UPDATE_INTERVAL);
});

// 🔹 Core function
async function shareLocation() {
    const token = localStorage.getItem("access_token");
    if (!token) {
        alert("Login first!");
        return;
    }

    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(async function (pos) {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const resp = await fetch("http://127.0.0.1:8000/location/update", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                latitude: lat,
                longitude: lng
            })
        });

        const data = await resp.json();
        console.log("Location update:", data);

        if (data.is_present === 0) {
            alert("❌ You are marked ABSENT (moved more than 5 meters)");
        }
    }, function () {
        alert("Location permission denied");
    });
}
</script>
